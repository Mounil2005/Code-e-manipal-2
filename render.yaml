# Render blueprint for the resqnet backend (FastAPI + WebSockets).
# New > Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: resqnet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
