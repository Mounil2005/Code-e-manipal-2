# Keeps the Render free-tier backend awake: Render sleeps a web service after 15 minutes
# without traffic, and the first request after that waits ~1 minute while it wakes.
#
# Set the backend URL once: repo Settings -> Secrets and variables -> Actions -> Variables ->
# New variable RENDER_URL = https://<your-service>.onrender.com (no trailing slash).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::Repository variable RENDER_URL is not set; nothing to ping."
            exit 0
          fi
          url="${RENDER_URL%/}/api/health"
          # a sleeping instance can take ~60 s to answer, so allow a long timeout and retry
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "$url" || true)
            echo "attempt $i: HTTP $code $(head -c 120 /tmp/body 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::$url did not answer 200"
          exit 1
